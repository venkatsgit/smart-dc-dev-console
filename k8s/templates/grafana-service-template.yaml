# Grafana Service Template
# Variables: ENVIRONMENT, NAMESPACE, SERVICE_TYPE, PORT
apiVersion: v1
kind: Service
metadata:
  name: grafana-service-$ENVIRONMENT
  namespace: $NAMESPACE
  labels:
    app: grafana
    environment: $ENVIRONMENT
spec:
  type: $SERVICE_TYPE
  ports:
  - port: $PORT
    targetPort: $PORT
    protocol: TCP
    name: http
  selector:
    app: grafana
    environment: $ENVIRONMENT
