# Grafana Postgres datasource secret
# Variables: ENVIRONMENT, NAMESPACE, PG_*_B64
apiVersion: v1
kind: Secret
metadata:
  name: grafana-postgres-secret-$ENVIRONMENT
  namespace: $NAMESPACE
  labels:
    app: grafana
    environment: $ENVIRONMENT
type: Opaque
data:
  PG_USER: $PG_USER_B64
  PG_PASSWORD: $PG_PASSWORD_B64
  PG_HOST: $PG_HOST_B64
  PG_DATABASE: $PG_DATABASE_B64
  PG_PORT: $PG_PORT_B64
  PG_PROD_USER: $PG_PROD_USER_B64
  PG_PROD_PASSWORD: $PG_PROD_PASSWORD_B64
  PG_PROD_HOST: $PG_PROD_HOST_B64
  PG_PROD_DATABASE: $PG_PROD_DATABASE_B64
  PG_PROD_PORT: $PG_PROD_PORT_B64
