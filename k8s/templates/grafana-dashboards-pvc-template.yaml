# Grafana dashboards export PVC (Azure File) — for UI-exported / shared JSON
# Variables: ENVIRONMENT, NAMESPACE, STORAGE_SIZE
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-dashboards-pvc-$ENVIRONMENT
  namespace: $NAMESPACE
  labels:
    type: azurefile-grafana-dashboards
    environment: $ENVIRONMENT
    app: grafana
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile
  resources:
    requests:
      storage: $STORAGE_SIZE
  selector:
    matchLabels:
      type: azurefile-grafana-dashboards
      environment: $ENVIRONMENT
      app: grafana
