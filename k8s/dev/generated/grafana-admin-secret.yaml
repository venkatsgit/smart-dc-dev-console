# Grafana admin secret
# Variables: ENVIRONMENT, NAMESPACE, GF_SECURITY_ADMIN_*_B64
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret-dev
  namespace: smart-dc-dev
  labels:
    app: grafana
    environment: dev
type: Opaque
data:
  GF_SECURITY_ADMIN_USER: YWRtaW4=
  GF_SECURITY_ADMIN_PASSWORD: YWRtaW4=
