# Grafana Service Template
# Variables: ENVIRONMENT, NAMESPACE, SERVICE_TYPE, PORT
apiVersion: v1
kind: Service
metadata:
  name: grafana-service-dev
  namespace: smart-dc-dev
  labels:
    app: grafana
    environment: dev
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: grafana
    environment: dev
